<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDFUT · Electoral</title>
<link rel="stylesheet" href="visor.css?v=32">
<script src="visor.js?v=10"></script>
</head>
<body>

<div id="v-nav" data-page="electoral" data-refresh="cargarResumen()"></div>
<div class="page-hd"><h1 class="page-title">Electoral</h1><p class="page-sub">Resultados electorales y encuestas electorales de la base local C98_MEDFUT.</p></div>


<section class="enc-panel" aria-label="Encuestas electorales">
  <div class="enc-grid">
    <div><label for="enc-nivel">Nivel</label><select id="enc-nivel" onchange="loadEncuestas()"></select></div>
    <div><label for="enc-lista">Lista de elección</label><select id="enc-lista" onchange="loadEncuestas()"></select></div>
    <div class="enc-wide"><label for="enc-sel">Encuesta electoral</label><select id="enc-sel" onchange="onSelEncuesta()"></select></div>
    <div><label for="enc-tipo">Tipo de encuesta</label><select id="enc-tipo" onchange="loadEncuestas()"></select></div>
  </div>
  <div id="enc-detalle" class="enc-detalle"></div>
</section>

<section class="enc-panel" id="geo-panel" aria-label="Ubicación">
  <h2 class="enc-titulo">Ubicación</h2>
  <div class="geo-grid">
    <div><label for="geo-reg">Región</label><select id="geo-reg" onchange="onGeoChange('reg')"></select></div>
    <div><label for="geo-dep">Departamento</label><select id="geo-dep" onchange="onGeoChange('dep')"></select></div>
    <div><label for="geo-mun">Municipio</label><select id="geo-mun" onchange="onGeoChange('mun')"></select></div>
    <div><label for="geo-zon">Zona</label><select id="geo-zon" onchange="onGeoChange('zon')"></select></div>
    <div><label for="geo-com">Comuna / Localidad</label><select id="geo-com" onchange="onGeoChange('com')"></select></div>
    <div><label for="geo-bar">Barrio</label><select id="geo-bar" onchange="onGeoChange('bar')"></select></div>
  </div>
</section>

<main class="elec">
  <section id="elec-kpis" class="elec-kpis" aria-label="Resumen de la encuesta"></section>
  <section class="enc-panel elec-viz" aria-label="Resultados">
    <div class="elec-tools" id="elec-tools" hidden>
      <div class="elec-tabs" id="elec-tabs" role="tablist"></div>
      <div class="elec-cortar"><span>Cortar por</span><div class="elec-tabs" id="elec-cortes"></div></div>
      <label class="elec-valid" id="elec-valid-wrap" hidden><input type="checkbox" id="elec-valid" onchange="window.elecValidos(this.checked)"> Solo votos válidos</label>
    </div>
    <div id="elec-body" class="elec-body"><div class="elec-vacio">Cargando encuestas…</div></div>
  </section>
  <p class="elec-nota" id="elec-nota"></p>
</main>

<script>
// ── Encuestas electorales: list box + selectores (tipo, lista de elección, nivel) ──────────
const API_IMP='leads_importer.php';
let ENC={opciones:null,lista:[],listasLlenas:false};
const $e=id=>document.getElementById(id);
const optHtml=(arr,todas,extra)=>`<option value="">${todas}</option>${extra?`<option value="__sin__">${extra}</option>`:''}`+arr.map(o=>`<option value="${o.v}">${o.l}</option>`).join('');
const lblOpt=(arr,v)=>(arr.find(o=>o.v===v)||{}).l||null;
// tipo_encuesta admite varios valores separados por coma
const lblMulti=(arr,v)=>v?String(v).split(',').map(x=>lblOpt(arr,x)||x).join(' · '):null;
const escH=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtFecha=s=>s?String(s).slice(0,10):'';

async function loadEncuestas(){
  const q=new URLSearchParams({action:'encuestas_electorales',
    tipo_encuesta:$e('enc-tipo').value||'',lista_eleccion:$e('enc-lista').value||'',nivel_eleccion:$e('enc-nivel').value||''});
  try{
    const d=await fetch(`${API_IMP}?${q}`).then(r=>r.json());
    if(!d.ok) throw new Error(d.error||'Error');
    if(!ENC.opciones){   // los selectores se llenan una sola vez
      ENC.opciones=d.opciones;
      $e('enc-tipo').innerHTML =optHtml(d.opciones.tipos,'Todos','Sin clasificar');
      $e('enc-lista').innerHTML=optHtml(d.opciones.listas,'Todas','Sin clasificar');
      $e('enc-nivel').innerHTML=optHtml(d.opciones.niveles,'Todos','Sin clasificar');
    }
    ENC.lista=d.encuestas;
    const prev=$e('enc-sel').value;
    $e('enc-sel').innerHTML=`<option value="">Todas las encuestas electorales (${d.encuestas.length})</option>`+
      d.encuestas.map(e=>`<option value="${e.id}">#${e.id} · ${escH(e.archivo)} (${fmtFecha(e.importado_en)})</option>`).join('');
    if(d.encuestas.some(e=>String(e.id)===prev)) $e('enc-sel').value=prev;
    if(!$e('enc-sel').value && d.encuestas.length && !ENC.auto){ $e('enc-sel').value=String(d.encuestas[0].id); ENC.auto=true; }
    onSelEncuesta();
  }catch(err){ $e('enc-detalle').textContent='No se pudieron cargar las encuestas electorales: '+err.message; }
}
function renderEncDetalle(){
  const id=$e('enc-sel').value, box=$e('enc-detalle');
  if(!ENC.opciones){ box.textContent=''; return; }
  const o=ENC.opciones, e=ENC.lista.find(x=>String(x.id)===id);
  if(!e){
    box.innerHTML=ENC.lista.length?`${ENC.lista.length} encuesta(s) electoral(es) con estos filtros. Elige una para ver su detalle.`:'No hay encuestas electorales con estos filtros.';
    return;
  }
  const chip=(k,v)=>`<span class="enc-chip ${v?'':'enc-chip-vacio'}"><b>${k}</b> ${v?escH(v):'sin clasificar'}</span>`;
  box.innerHTML=`<span><b>${escH(e.archivo)}</b> · ${Number(e.filas_ins).toLocaleString('es-CO')} respuestas · importada ${fmtFecha(e.importado_en)}</span>
    ${chip('Tipo',lblMulti(o.tipos,e.tipo_encuesta))}${chip('Lista',lblOpt(o.listas,e.lista_eleccion))}${chip('Nivel',lblOpt(o.niveles,e.nivel_eleccion))}
    <button class="btn btn-outline btn-sm" onclick="editarEncMeta(${e.id})">Clasificar</button>`;
}
function editarEncMeta(id){
  const e=ENC.lista.find(x=>x.id==id), o=ENC.opciones, box=$e('enc-detalle');
  const sel=(cid,arr,cur)=>`<select id="${cid}">${arr.map(x=>`<option value="${x.v}" ${x.v===cur?'selected':''}>${x.l}</option>`).join('')}</select>`;
  box.innerHTML=`<span><b>${escH(e.archivo)}</b></span>
    <span class="em-tipos">Tipo ${o.tipos.map(t=>`<label class="em-check"><input type="checkbox" name="em-tipo" value="${t.v}" ${(e.tipo_encuesta||'').split(',').includes(t.v)?'checked':''}> ${t.l}</label>`).join('')}</span>
    <label>Lista ${sel('em-lista',[{v:'',l:'— Sin especificar —'},...o.listas],e.lista_eleccion||'')}</label>
    <label>Nivel ${sel('em-nivel',[{v:'',l:'— Sin especificar —'},...o.niveles],e.nivel_eleccion||'')}</label>
    <button class="btn btn-primary btn-sm" onclick="guardarEncMeta(${id})">Guardar</button>
    <button class="btn btn-outline btn-sm" onclick="renderEncDetalle()">Cancelar</button>`;
}
async function guardarEncMeta(id){
  const fd=new FormData(); fd.append('import_id',id);
  fd.append('tipo_encuesta',[...document.querySelectorAll('input[name=em-tipo]:checked')].map(c=>c.value).join(',')); fd.append('lista_eleccion',$e('em-lista').value); fd.append('nivel_eleccion',$e('em-nivel').value);
  try{
    const d=await fetch(`${API_IMP}?action=encuesta_meta_set`,{method:'POST',body:fd}).then(r=>r.json());
    if(!d.ok) throw new Error(d.error||'Error');
    await loadEncuestas(); $e('enc-sel').value=String(id); onSelEncuesta();
  }catch(err){ alert('No se pudo guardar: '+err.message); }
}
function onSelEncuesta(){ renderEncDetalle(); if(window.cargarResumen) window.cargarResumen(); }
document.addEventListener('DOMContentLoaded',loadEncuestas);

// ── Filtros geográficos en cascada: Región → Departamento → Municipio → Zona → Comuna → Barrio ──
// Fuente: c98geo_api.php (árbol completo). La selección queda en window.ELECTORAL_GEO.
const GEO_NIVELES=[
  {k:'reg',id:'geo-reg',todos:'Todas',hijos:n=>n,                                  nom:n=>n.r},
  {k:'dep',id:'geo-dep',todos:'Todos',hijos:r=>r.dptos||[],                       nom:n=>n.d},
  {k:'mun',id:'geo-mun',todos:'Todos',hijos:d=>(d.subrs||[]).flatMap(s=>s.mpios||[]),nom:n=>n.m},
  {k:'zon',id:'geo-zon',todos:'Todas',hijos:m=>m.detail||[],                      nom:n=>n.z},
  {k:'com',id:'geo-com',todos:'Todas',hijos:z=>z.coms||[],                        nom:n=>n.c},
  {k:'bar',id:'geo-bar',todos:'Todos',hijos:c=>c.bars||[],                        nom:n=>n.n},
];
let GEOT=[];
window.ELECTORAL_GEO={};
function geoNodo(i){            // nodo elegido en el nivel i (o null)
  const v=$e(GEO_NIVELES[i].id).value; if(!v) return null;
  return (GEO_NIVELES[i]._lista||[]).find(n=>String(n.id)===v)||null;
}
function geoRefill(desde){
  for(let i=desde;i<GEO_NIVELES.length;i++){
    const nv=GEO_NIVELES[i], padre=i===0?GEOT:geoNodo(i-1);
    const lista=i===0?GEOT:(padre?nv.hijos(padre):[]);
    nv._lista=lista;
    const sel=$e(nv.id);
    sel.innerHTML=`<option value="">${nv.todos}</option>`+lista.map(n=>`<option value="${escH(n.id)}">${escH(nv.nom(n))}</option>`).join('');
    sel.disabled=i>0&&!padre;
  }
}
function onGeoChange(k){
  const i=GEO_NIVELES.findIndex(n=>n.k===k);
  geoRefill(i+1);
  window.ELECTORAL_GEO=Object.fromEntries(GEO_NIVELES.map((n,j)=>[n.k,$e(n.id).value||null]));
  document.dispatchEvent(new CustomEvent('electoral:geo',{detail:window.ELECTORAL_GEO}));
}
async function loadGeoFiltros(){
  try{
    const d=await fetch('c98geo_api.php').then(r=>r.json());
    if(!d.ok) throw new Error(d.error||'Error');
    GEOT=d.data; geoRefill(0);
  }catch(err){ $e('geo-panel').insertAdjacentHTML('beforeend',`<p class="enc-detalle">No se pudo cargar la ubicación: ${escH(err.message)}</p>`); }
}
document.addEventListener('DOMContentLoaded',loadGeoFiltros);
</script>
<script src="electoral.js?v=5"></script>
<script>V.onTheme(function(){ location.reload(); });</script>
</body>
</html>
