<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GET · Ingresar</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--mut:#8b949e;--acc:#2f81f7}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,Segoe UI,sans-serif}
  form{width:min(360px,92vw);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
  h1{margin:0 0 4px;font-size:22px} p{margin:0 0 20px;color:var(--mut);font-size:13px}
  label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
  input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font:inherit}
  input:focus{outline:2px solid var(--acc);border-color:transparent}
  button{width:100%;margin-top:20px;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  #err{min-height:20px;margin-top:12px;color:#f85149;font-size:13px}
</style>
</head>
<body>
<form id="f">
  <h1>GET</h1>
  <p>Ingresa con tu cuenta para ver los datos.</p>
  <label for="email">Correo</label>
  <input id="email" type="email" autocomplete="username" required autofocus>
  <label for="pw">Contraseña</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Ingresar</button>
  <div id="err" role="alert"></div>
</form>
<script>
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const b = document.getElementById('b'), err = document.getElementById('err');
    b.disabled = true; err.textContent = '';
    try {
      const r = await fetch('/api/auth?action=login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('pw').value }),
      });
      const j = await r.json();
      if (!r.ok || !j.ok) throw new Error(j.error || 'No se pudo ingresar');
      const next = new URLSearchParams(location.search).get('next');
      location.replace(next && next.startsWith('/') && !next.startsWith('//') ? next : '/');
    } catch (ex) { err.textContent = ex.message; b.disabled = false; }
  });
</script>
</body>
</html>
